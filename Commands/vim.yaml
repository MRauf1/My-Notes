deck: Commands::Vim
source: https://vimhelp.org/
entries:
  # --- Help, saving, quitting --------------------------------------------

  - command: ":help"
    meaning: Open Vim's built-in documentation; :help <topic> jumps to a topic, e.g. :help dd or :help :w.
    details: |
      `Ctrl+]` follows a link (tag) and `Ctrl+O` jumps back; `:q` closes the help window. Prefix modes: `:help i_CTRL-W` (Insert mode), `:help v_d` (Visual).
    tags: [files]
    source: https://vimhelp.org/helphelp.txt.html

  - command: ":q"
    meaning: Quit the current window, refusing if the buffer has unsaved changes.
    details: |
      `:qa` quits all windows.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Aq

  - command: ":q!"
    meaning: Quit without saving, discarding any unsaved changes.
    details: |
      `:qa!` discards changes in all buffers and exits Vim.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Aq

  - command: ":w"
    meaning: Write (save) the buffer to its file.
    details: |
      `:w <file>` writes to another file; `:w !sudo tee %` saves a file you opened without root.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Aw

  - command: ":w!"
    meaning: Forcefully write the file even when 'readonly' is set or writing was otherwise refused.
    details: |
      Can't override missing filesystem permissions (use `sudo`/`sudoedit` for root-owned files).
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Aw%21

  - command: ":wq"
    meaning: Write the file and quit.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Awq

  - command: ":wq!"
    meaning: Forcefully write the file (even if 'readonly') and quit.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Awq

  - command: ":x"
    meaning: Like :wq, but write only if the buffer has changes, then quit.
    details: |
      Unlike `:wq`, it leaves the file's modification time untouched when nothing changed.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#%3Ax

  - command: "ZZ"
    meaning: Normal-mode shortcut for :x, i.e. write if changed and quit.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#ZZ

  - command: "ZQ"
    meaning: Normal-mode shortcut for :q!, i.e. quit without saving.
    tags: [files]
    source: https://vimhelp.org/editing.txt.html#ZQ

  # --- Searching ---------------------------------------------------------

  - command: "/<pattern>"
    meaning: Search forward for the pattern (a regular expression) and jump to the next match.
    details: |
      Press `Enter` to run the search. `/` with no pattern repeats the last search forward.
    tags: [search]
    source: https://vimhelp.org/pattern.txt.html#%2F

  - command: "?<pattern>"
    meaning: Search backward for the pattern.
    tags: [search]
    source: https://vimhelp.org/pattern.txt.html#%3F

  - command: "n / N"
    meaning: Repeat the last search in the same (n) or opposite (N) direction.
    tags: [search]
    source: https://vimhelp.org/pattern.txt.html#n

  - command: "*"
    meaning: Search forward for the next occurrence of the whole word under (or nearest to) the cursor.
    details: |
      `g*` also matches the word as part of longer words.
    tags: [search]
    source: https://vimhelp.org/pattern.txt.html#star

  - command: "#"
    meaning: Search backward for the previous occurrence of the whole word under the cursor (the backward version of *).
    tags: [search]
    source: https://vimhelp.org/pattern.txt.html#%23

  - command: ":%s/<old>/<new>/g"
    meaning: Substitute new for every match of old on all lines of the file (% is the range of all lines).
    details: |
      Without `%` only the current line is affected; add `c` (`/gc`) to confirm each replacement.
    tags: [search, editing]
    source: https://vimhelp.org/change.txt.html#%3Asubstitute

  # --- Motions -----------------------------------------------------------

  - command: "h"
    meaning: Move the cursor one character left.
    details: |
      A count repeats a motion: `5h` moves 5 characters left.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#h

  - command: "j"
    meaning: Move the cursor one line down.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#j

  - command: "k"
    meaning: Move the cursor one line up.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#k

  - command: "l"
    meaning: Move the cursor one character right.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#l

  - command: "w"
    meaning: Move forward to the start of the next word, where a word is a run of letters, digits, and underscores, or a run of other non-blank characters.
    details: |
      So `foo.bar` has three words: `foo`, `.`, `bar`.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#w

  - command: "b"
    meaning: Move backward to the start of the current or previous word.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#b

  - command: "e"
    meaning: Move forward to the end of the current or next word.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#e

  - command: "W"
    meaning: Move forward to the start of the next WORD, where a WORD is any run of non-blank characters (punctuation included).
    details: |
      `foo.bar(x)` is a single WORD, so `W` skips over it in one step.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#W

  - command: "B"
    meaning: Move backward to the start of the current or previous WORD (whitespace-delimited).
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#B

  - command: "E"
    meaning: Move forward to the end of the current or next WORD (whitespace-delimited).
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#E

  - command: "0"
    meaning: Move to the first character (column 0) of the line.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#0

  - command: "^"
    meaning: Move to the first non-blank character of the line.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#%5E

  - command: "$"
    meaning: Move to the end of the line.
    details: |
      With a count, `3$` goes to the end of the line 2 lines below.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#%24

  - command: "gg"
    meaning: Go to the first line of the file.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#gg

  - command: "G"
    meaning: Go to the last line of the file.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#G

  - command: "{Number}G"
    meaning: Go to line Number, e.g. 42G.
    details: |
      `:42` and `42gg` do the same. `Ctrl+G` shows the current line number and file position.
    tags: [motions]
    source: https://vimhelp.org/motion.txt.html#G

  - command: "Ctrl+F"
    meaning: Scroll forward (down) one screen.
    details: |
      `Ctrl+D` scrolls down half a screen.
    tags: [motions]
    source: https://vimhelp.org/scroll.txt.html#CTRL-F

  - command: "Ctrl+B"
    meaning: Scroll backward (up) one screen.
    details: |
      `Ctrl+U` scrolls up half a screen.
    tags: [motions]
    source: https://vimhelp.org/scroll.txt.html#CTRL-B

  # --- Entering Insert mode ----------------------------------------------

  - command: "i"
    meaning: Enter Insert mode before the cursor.
    details: |
      `Esc` (or `Ctrl+[`) returns to Normal mode.
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#i

  - command: "a"
    meaning: Enter Insert mode after the cursor (append).
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#a

  - command: "I"
    meaning: Enter Insert mode before the first non-blank character of the line.
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#I

  - command: "A"
    meaning: Enter Insert mode at the end of the line (append to the line).
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#A

  - command: "o"
    meaning: Open a new line below the current one and enter Insert mode.
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#o

  - command: "O"
    meaning: Open a new line above the current one and enter Insert mode.
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#O

  - command: ":a"
    meaning: Ex command :append, which inserts the lines you type below the current line (or a given line), ending with a line containing only a period.
    details: |
      Mostly an old ex/vi feature; `o` is the usual Normal-mode way to add lines. Not supported in Vim9 script.
    tags: [insert]
    source: https://vimhelp.org/insert.txt.html#%3Aappend

  # --- Operators ---------------------------------------------------------

  - command: "[count] operator [count] motion"
    meaning: The general form of a Vim edit, applying an operator (such as d, c, or y) to the text covered by a motion.
    details: |
      Counts multiply: `2d3w` deletes 6 words. Doubling an operator acts on whole lines (`dd`, `cc`, `yy`). Text objects also work as motions: `diw` deletes the inner word, `ci"` changes inside quotes.
    tags: [operators]
    source: https://vimhelp.org/motion.txt.html#operator

  - command: "d{motion}"
    meaning: Delete the text covered by the motion, e.g. dw (to next word), d$ (to end of line), dG (to end of file).
    details: |
      Deleted text goes into a register, so `d` is also "cut" and can be pasted with `p`. `D` is `d$`.
    tags: [operators]
    source: https://vimhelp.org/change.txt.html#d

  - command: "c{motion}"
    meaning: Change the text covered by the motion, i.e. delete it and enter Insert mode, e.g. cw or c$.
    details: |
      `C` is `c$` (change to the end of the line). `cw` behaves like `ce`, so it doesn't delete the trailing space.
    tags: [operators]
    source: https://vimhelp.org/change.txt.html#c

  - command: "y{motion}"
    meaning: Yank (copy) the text covered by the motion into a register, e.g. yw, y$, yG.
    details: |
      `"+y` yanks to the system clipboard. Arch's `vim` package is built without clipboard support (`-clipboard`); the `gvim` package's vim has it, and Neovim uses `wl-copy`/`xclip`.
    tags: [operators]
    source: https://vimhelp.org/change.txt.html#y

  - command: "dd"
    meaning: Delete the whole current line (3dd deletes 3 lines).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#dd

  - command: "cc"
    meaning: Change the whole current line, deleting its text (keeping the indent) and entering Insert mode.
    details: |
      `S` is a synonym.
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#cc

  - command: "yy"
    meaning: Yank (copy) the whole current line.
    details: |
      `Y` is a synonym in Vim (`y$` in Neovim).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#yy

  - command: "D"
    meaning: Delete from the cursor to the end of the line (same as d$).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#D

  - command: "C"
    meaning: Change from the cursor to the end of the line (same as c$).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#C

  # --- Simple edits ------------------------------------------------------

  - command: "x"
    meaning: Delete the character under the cursor (3x deletes 3 characters).
    details: |
      `X` deletes the character before the cursor. `xp` swaps two characters.
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#x

  - command: "r{char}"
    meaning: Replace the character under the cursor with char, staying in Normal mode.
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#r

  - command: "R"
    meaning: Enter Replace mode, where each typed character overwrites the one under the cursor.
    details: |
      `Backspace` restores the original characters. `Esc` exits.
    tags: [editing]
    source: https://vimhelp.org/insert.txt.html#R

  - command: "p"
    meaning: Put (paste) the last yanked or deleted text after the cursor (below the line for whole lines).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#p

  - command: "P"
    meaning: Put (paste) the last yanked or deleted text before the cursor (above the line for whole lines).
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#P

  - command: "J"
    meaning: Join the next line onto the current one, removing its indent and inserting a space.
    details: |
      With a count, `3J` joins 3 lines. `gJ` joins without inserting or removing spaces.
    tags: [editing]
    source: https://vimhelp.org/change.txt.html#J

  - command: "u"
    meaning: Undo the last change (repeatable, e.g. 3u).
    tags: [editing]
    source: https://vimhelp.org/undo.txt.html#u

  - command: "Ctrl+R"
    meaning: Redo, i.e. undo the last undo.
    tags: [editing]
    source: https://vimhelp.org/undo.txt.html#CTRL-R

  - command: "."
    meaning: Repeat the last change (e.g. repeat a dw or an insertion at the cursor).
    details: |
      Combine with `n` to repeat an edit at each search match.
    tags: [editing]
    source: https://vimhelp.org/repeat.txt.html#.

  # --- Visual mode -------------------------------------------------------

  - command: "v"
    meaning: Start characterwise Visual mode to select text, then apply an operator such as d, y, c, or > (indent).
    tags: [visual]
    source: https://vimhelp.org/visual.txt.html#v

  - command: "V"
    meaning: Start linewise Visual mode, selecting whole lines.
    tags: [visual]
    source: https://vimhelp.org/visual.txt.html#V

  - command: "Ctrl+V"
    meaning: Start blockwise Visual mode, selecting a rectangular block of text.
    details: |
      `I` / `A` then insert text on every selected line (e.g. to comment out several lines).
    tags: [visual]
    source: https://vimhelp.org/visual.txt.html#CTRL-V

  # --- Neovim ------------------------------------------------------------

  - command: ":checkhealth"
    meaning: (Neovim) Run health checks to diagnose problems with the configuration, providers, and plugins.
    tags: [neovim]
    source: https://neovim.io/doc/user/health.html

  # --- My config: basics (kickstart.nvim) ---------------------------------
  # Leader and localleader are both Space in my config.

  - command: "Space (then wait)"
    meaning: (My config, which-key) Open a popup listing every key that can follow the leader, grouped by prefix.
    details: |
      Opens immediately (`delay = 0`). Works for any prefix, e.g. `g`, `gr`, `Space s`.
    tags: [config, which-key]
    source: https://github.com/folke/which-key.nvim

  - command: "Esc (Normal mode)"
    meaning: (My config) Clear the search highlighting (runs :nohlsearch).
    tags: [config]
    source: https://neovim.io/doc/user/pattern.html#%3Anohlsearch

  - command: "Ctrl+H / Ctrl+J / Ctrl+K / Ctrl+L"
    meaning: (My config) Move focus to the window on the left / below / above / on the right.
    details: |
      Shortcuts for `Ctrl+W h/j/k/l`.
    tags: [config, windows]
    source: https://neovim.io/doc/user/windows.html#CTRL-W_h

  - command: "Esc Esc (Terminal mode)"
    meaning: (My config) Leave Terminal mode and return to Normal mode in the built-in terminal.
    details: |
      Shortcut for the built-in `Ctrl+\ Ctrl+N`, which still works where the double Esc is swallowed.
    tags: [config, terminal]
    source: https://neovim.io/doc/user/terminal.html#Terminal-mode

  - command: "]d / [d"
    meaning: (Neovim) Jump to the next / previous diagnostic; my config also opens its message in a float.
    details: |
      `]D` / `[D` jump to the last / first diagnostic in the buffer.
    tags: [config, diagnostics]
    source: https://neovim.io/doc/user/diagnostic.html#%5Dd

  - command: "Space q"
    meaning: (My config) Put the buffer's diagnostics in the location list.
    details: |
      Then `:lnext` / `:lprev` step through them and `:lclose` closes the list.
    tags: [config, diagnostics]
    source: https://neovim.io/doc/user/diagnostic.html#vim.diagnostic.setloclist()

  - command: "Space f"
    meaning: (My config, conform.nvim) Format the buffer, or the selection in Visual mode.
    details: |
      Lua, Python, C and C++ are also formatted on save (stylua, ruff, clang-format); other filetypes fall back to the LSP formatter. `:ConformInfo` shows which formatters apply.
    tags: [config, conform]
    source: https://github.com/stevearc/conform.nvim

  # --- My config: Telescope (fuzzy finder, fzf-native sorter) -------------

  - command: "Space sf"
    meaning: (My config, Telescope) Fuzzy-find files in the current directory by name.
    details: |
      Respects `.gitignore`. In any picker: `Ctrl+X` / `Ctrl+V` / `Ctrl+T` open in a split / vsplit / tab.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#file-pickers

  - command: "Space sg"
    meaning: (My config, Telescope) Live-grep the project for text as you type (ripgrep).
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#file-pickers

  - command: "Space sw"
    meaning: (My config, Telescope) Grep the project for the word under the cursor, or for the selection in Visual mode.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#file-pickers

  - command: "Space s/"
    meaning: (My config, Telescope) Live-grep only within the currently open buffers.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#file-pickers

  - command: "Space /"
    meaning: (My config, Telescope) Fuzzy-search lines in the current buffer.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space Space"
    meaning: (My config, Telescope) Fuzzy-pick one of the open buffers to switch to.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space s."
    meaning: (My config, Telescope) Fuzzy-pick a recently opened file.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space sh"
    meaning: (My config, Telescope) Fuzzy-search the help tags and open the chosen help page.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space sk"
    meaning: (My config, Telescope) Fuzzy-search all defined keymaps with their descriptions.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space sc"
    meaning: (My config, Telescope) Fuzzy-search Ex commands and run the chosen one.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space sd"
    meaning: (My config, Telescope) Fuzzy-search the LSP diagnostics of all open buffers.
    tags: [config, telescope, diagnostics]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "Space sr"
    meaning: (My config, Telescope) Reopen the last picker with its previous query and results.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#vim-pickers

  - command: "Space ss"
    meaning: (My config, Telescope) List all Telescope pickers and open the chosen one.
    details: |
      Same as `:Telescope` with no argument; `:Telescope <picker>` opens one directly, e.g. `:Telescope colorscheme`.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#usage

  - command: "Space sn"
    meaning: (My config, Telescope) Fuzzy-find files in the Neovim config directory.
    tags: [config, telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#file-pickers

  - command: "Ctrl+/ (in a Telescope picker)"
    meaning: (Telescope) Show the picker's key mappings; ? does the same in Normal mode.
    tags: [telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#default-mappings

  - command: "Ctrl+Q (in a Telescope picker)"
    meaning: (Telescope) Send all matching results to the quickfix list.
    details: |
      `Tab` / `Shift+Tab` mark results; `Alt+Q` sends only the marked ones.
    tags: [telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#default-mappings

  - command: "Ctrl+U / Ctrl+D (in a Telescope picker)"
    meaning: (Telescope) Scroll the preview window up / down.
    details: |
      `Ctrl+C` (Insert) or `Esc` (Normal) closes the picker.
    tags: [telescope]
    source: https://github.com/nvim-telescope/telescope.nvim#default-mappings

  # --- My config: LSP ------------------------------------------------------

  - command: "grd"
    meaning: (My config, LSP) Go to the definition of the symbol under the cursor.
    details: |
      `Ctrl+T` jumps back. Opens a Telescope picker if there are several.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "grr"
    meaning: (My config, LSP) List all references to the symbol under the cursor in Telescope.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "gri"
    meaning: (My config, LSP) Go to the implementation(s) of the symbol under the cursor.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "grt"
    meaning: (My config, LSP) Go to the type definition of the symbol under the cursor.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "grD"
    meaning: (My config, LSP) Go to the declaration of the symbol under the cursor (e.g. the C header), not its definition.
    tags: [config, lsp]
    source: https://neovim.io/doc/user/lsp.html#vim.lsp.buf.declaration()

  - command: "grn"
    meaning: (LSP) Rename the symbol under the cursor everywhere it is used.
    tags: [config, lsp]
    source: https://neovim.io/doc/user/lsp.html#grn

  - command: "gra"
    meaning: (LSP) Show code actions (quick fixes, refactorings) for the cursor position or selection.
    tags: [config, lsp]
    source: https://neovim.io/doc/user/lsp.html#gra

  - command: "gO"
    meaning: (My config, LSP) Fuzzy-search the symbols (functions, classes, …) of the current file.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "gW"
    meaning: (My config, LSP) Fuzzy-search symbols across the whole workspace.
    tags: [config, lsp]
    source: https://github.com/nvim-telescope/telescope.nvim#neovim-lsp-pickers

  - command: "K"
    meaning: (LSP) Show hover documentation for the symbol under the cursor; press K again to enter the float.
    details: |
      In `.tex` buffers VimTeX maps `K` to open the documentation of the package under the cursor instead.
    tags: [config, lsp]
    source: https://neovim.io/doc/user/lsp.html#K-lsp-default

  - command: "Space th"
    meaning: (My config, LSP) Toggle inlay hints (inline type and parameter annotations).
    details: |
      Only mapped when the attached server supports inlay hints.
    tags: [config, lsp]
    source: https://neovim.io/doc/user/lsp.html#vim.lsp.inlay_hint.enable()

  - command: "Space ch"
    meaning: (My config, clangd) Switch between a C/C++ source file and its header.
    tags: [config, lsp]
    source: https://github.com/neovim/nvim-lspconfig/blob/master/doc/configs.md#clangd

  - command: ":Mason"
    meaning: (mason.nvim) Open the UI for installing and updating LSP servers, formatters and debuggers.
    details: |
      Press `g?` for help inside. `:MasonInstall <pkg>` installs directly.
    tags: [config, mason]
    source: https://github.com/mason-org/mason.nvim#commands

  # --- My config: completion and snippets (blink.cmp, LuaSnip) -------------

  - command: "Ctrl+Y (completion menu)"
    meaning: (blink.cmp) Accept the selected completion item, expanding it if it is a snippet.
    details: |
      `Ctrl+N` / `Ctrl+P` select next / previous; `Ctrl+E` closes the menu.
    tags: [config, completion]
    source: https://cmp.saghen.dev/configuration/keymap

  - command: "Ctrl+Space (Insert mode)"
    meaning: (blink.cmp) Open the completion menu, or toggle the documentation of the selected item if it is already open.
    details: |
      `Ctrl+B` / `Ctrl+F` scroll the documentation.
    tags: [config, completion]
    source: https://cmp.saghen.dev/configuration/keymap

  - command: "Ctrl+K (Insert mode)"
    meaning: (blink.cmp) Toggle the function signature help window.
    tags: [config, completion]
    source: https://cmp.saghen.dev/configuration/keymap

  - command: "Tab / Shift+Tab (in a snippet)"
    meaning: (blink.cmp + LuaSnip) Jump to the next / previous placeholder of an expanded snippet.
    tags: [config, completion]
    source: https://cmp.saghen.dev/configuration/keymap

  # --- My config: text objects and surround (mini.nvim) --------------------

  - command: "a{id} / i{id} (mini.ai)"
    meaning: (mini.ai) Extended around / inside text objects, e.g. daf deletes a function call, cia changes an argument.
    details: |
      Ids: `b` brackets, `q` quotes, `f` function call, `a` argument, `t` tag, `?` prompt for left/right edges; any other character is used as its own delimiter (e.g. `ci_`). Searches up to 500 lines away.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-ai.md

  - command: "aa{id} / ii{id} / al{id} / il{id}"
    meaning: (mini.ai) Select the next (aa/ii) or last (al/il) such text object instead of the one under the cursor, e.g. cii) changes inside the next parentheses.
    details: |
      My config remaps next from the default `an`/`in` to `aa`/`ii`, so Neovim's built-in incremental selection `an`/`in` still works.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-ai.md

  - command: "g[ / g] (mini.ai)"
    meaning: (mini.ai) Move the cursor to the left / right edge of a text object, e.g. g[) jumps to the opening parenthesis.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-ai.md

  - command: "sa{motion}{char}"
    meaning: (mini.surround) Add a surrounding, e.g. saiw) wraps the word in parentheses.
    details: |
      In Visual mode `sa{char}` surrounds the selection. `{char}` can be `f` (function call, prompts for name), `t` (tag) or `?` (prompt).
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-surround.md

  - command: "sd{char}"
    meaning: (mini.surround) Delete the surrounding, e.g. sd' removes the quotes around the cursor.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-surround.md

  - command: "sr{old}{new}"
    meaning: (mini.surround) Replace a surrounding, e.g. sr)' turns parentheses into single quotes.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-surround.md

  - command: "sf{char} / sF{char} / sh{char}"
    meaning: (mini.surround) Find the next / previous surrounding, or briefly highlight it.
    details: |
      Suffix `n` / `l` targets the next / last one, e.g. `sdn)`.
    tags: [config, mini]
    source: https://github.com/nvim-mini/mini.nvim/blob/main/readmes/mini-surround.md

  # --- My config: debugging (nvim-dap) -------------------------------------

  - command: "F5"
    meaning: (My config, nvim-dap) Start debugging, or continue to the next breakpoint.
    details: |
      dap-ui opens automatically when a session starts and closes when it ends. Debuggers: debugpy (Python), codelldb (C/C++, compile with `-g`).
    tags: [config, debug]
    source: https://github.com/mfussenegger/nvim-dap

  - command: "F1 / F2 / F3"
    meaning: (My config, nvim-dap) Step into / step over / step out of the current line while debugging.
    tags: [config, debug]
    source: https://github.com/mfussenegger/nvim-dap

  - command: "Space b"
    meaning: (My config, nvim-dap) Toggle a breakpoint on the current line.
    details: |
      `Space B` sets a conditional breakpoint (prompts for the condition).
    tags: [config, debug]
    source: https://github.com/mfussenegger/nvim-dap

  - command: "F7"
    meaning: (My config, nvim-dap-ui) Toggle the debugger UI, e.g. to see the last session's output after a crash.
    details: |
      In `.tex` buffers `F7` in Insert/Visual mode is VimTeX's create-command instead.
    tags: [config, debug]
    source: https://github.com/rcarriga/nvim-dap-ui

  # --- My config: misc plugins ---------------------------------------------

  - command: ":PasteImage"
    meaning: (img-clip.nvim) Save the image on the clipboard to a file and insert a link to it (Markdown, LaTeX, …).
    details: |
      Dragging an image into the terminal also works, even in Insert mode.
    tags: [config, img-clip]
    source: https://github.com/HakonHarnes/img-clip.nvim#commands

  - command: ":TodoTelescope"
    meaning: (todo-comments) Fuzzy-search all TODO/FIX/HACK/WARN/PERF/NOTE/TEST comments in the project.
    details: |
      `:TodoQuickFix` / `:TodoLocList` put them in the quickfix / location list; `keywords=TODO,FIX` filters.
    tags: [config, todo-comments]
    source: https://github.com/folke/todo-comments.nvim#-usage

  - command: ":GuessIndent"
    meaning: (guess-indent.nvim) Detect the file's indentation style and set tabs/spaces and width to match.
    details: |
      Runs automatically when a file is opened.
    tags: [config]
    source: https://github.com/NMAC427/guess-indent.nvim

  - command: ":lua vim.pack.update()"
    meaning: (Neovim 0.12 vim.pack) Fetch plugin updates and show a confirmation buffer to apply them.
    details: |
      `:write` in that buffer applies the updates. `vim.pack.update(nil, { offline = true })` only shows the current state.
    tags: [config, neovim]
    source: https://neovim.io/doc/user/pack.html#vim.pack.update()

  # --- My config: LaTeX (VimTeX, localleader = Space) ----------------------

  - command: "Space ll"
    meaning: (VimTeX) Toggle continuous compilation with latexmk; while on, every save recompiles and Zathura reloads the PDF.
    details: |
      `Space lk` stops it; `Space lS` compiles once without continuous mode. Same as `:VimtexCompile`.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space lv"
    meaning: (VimTeX) Open the PDF viewer at the position of the cursor (SyncTeX forward search).
    details: |
      Inverse search: `Ctrl+click` in Zathura jumps to the matching source line.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space le"
    meaning: (VimTeX) Show compilation errors in the quickfix window.
    details: |
      `Space lo` shows the raw compiler output; `Space lq` the log messages.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space lc"
    meaning: (VimTeX) Delete auxiliary build files (.aux, .log, …).
    details: |
      `Space lC` also deletes the PDF.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space lt"
    meaning: (VimTeX) Open the table of contents of the document; Enter jumps to a section.
    details: |
      `Space lT` toggles it.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space li"
    meaning: (VimTeX) Show info about the project (main file, compiler, viewer).
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space la"
    meaning: (VimTeX) Open a context menu for the item under the cursor (e.g. a citation or \ref).
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "Space lm"
    meaning: (VimTeX) List VimTeX's insert-mode math shortcuts.
    details: |
      They use the backtick prefix in math mode, e.g. `` `a `` → `\alpha`.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "dse / cse"
    meaning: (VimTeX) Delete / change the surrounding environment (\begin{…}…\end{…}).
    details: |
      `dsc`/`csc` for the surrounding command, `ds$`/`cs$` for the surrounding math environment, `dsd`/`csd` for delimiters.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "ts$"
    meaning: (VimTeX) Toggle between inline math ($…$) and display math (\[…\]).
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "tse / tss"
    meaning: (VimTeX) Toggle the surrounding environment (e.g. itemize ↔ enumerate) / toggle its star (equation ↔ equation*).
    details: |
      `tsc` toggles the star of the surrounding command.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "tsf"
    meaning: (VimTeX) Toggle a fraction between a/b and \frac{a}{b}.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "tsd"
    meaning: (VimTeX) Toggle the surrounding delimiter between (…) and \left(…\right).
    details: |
      `tsD` cycles in reverse.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "tsb"
    meaning: (VimTeX) Toggle the line break \\ at the end of the current line.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "F6 (LaTeX)"
    meaning: (VimTeX) Surround the current line, or the selection in Visual mode, with an environment you name.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "ie / ae"
    meaning: (VimTeX) Text object for inside / around a LaTeX environment, e.g. cie changes an equation's body.
    details: |
      Also: `i$`/`a$` math, `ic`/`ac` command, `id`/`ad` delimiter, `im`/`am` list item, `iP`/`aP` section.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "% (LaTeX)"
    meaning: (VimTeX) Jump between matching delimiters, including \begin/\end and \left/\right pairs.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "]] / [[ (LaTeX)"
    meaning: (VimTeX) Jump to the start of the next / previous section.
    details: |
      `]m`/`[m` environments, `]n`/`[n` math zones, `]r`/`[r` frames, `]/`/`[/` comments; capital letters jump to the ends.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt

  - command: "]] (LaTeX Insert mode)"
    meaning: (VimTeX) Close the nearest open environment or delimiter.
    tags: [config, vimtex, latex]
    source: https://github.com/lervag/vimtex/blob/master/doc/vimtex.txt
